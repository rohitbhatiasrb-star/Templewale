name: Update YouTube Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch YouTube Videos
        env:
          API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ["API_KEY"]
          HANDLE = "@templewale"

          def get(url, params):
              query = urllib.parse.urlencode(params)
              with urllib.request.urlopen(url + "?" + query) as r:
                  return json.load(r)

          # Get channel information
          channel = get(
              "https://www.googleapis.com/youtube/v3/channels",
              {
                  "part": "id,snippet,contentDetails",
                  "forHandle": HANDLE,
                  "key": API_KEY
              }
          )

          if not channel.get("items"):
              raise Exception("YouTube channel not found")

          item = channel["items"][0]

          channel_id = item["id"]
          uploads_playlist = item["contentDetails"]["relatedPlaylists"]["uploads"]

          # Get latest videos
          data = get(
              "https://www.googleapis.com/youtube/v3/playlistItems",
              {
                  "part": "snippet,contentDetails",
                  "playlistId": uploads_playlist,
                  "maxResults": 20,
                  "key": API_KEY
              }
          )

          videos = []

          for video in data.get("items", []):
              snippet = video["snippet"]
              video_id = video["contentDetails"]["videoId"]

              videos.append({
                  "id": video_id,
                  "title": snippet["title"],
                  "description": snippet.get("description", ""),
                  "thumbnail": f"https://i.ytimg.com/vi/{video_id}/hqdefault.jpg",
                  "url": f"https://www.youtube.com/watch?v={video_id}",
                  "publishedAt": snippet["publishedAt"]
              })

          output = {
              "channel": {
                  "id": channel_id,
                  "name": item["snippet"]["title"],
                  "handle": HANDLE
              },
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "videos": videos
          }

          with open("youtube.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Updated {len(videos)} YouTube videos")
          PY

      - name: Commit YouTube Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add youtube.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update YouTube content"
            git push
          fi
