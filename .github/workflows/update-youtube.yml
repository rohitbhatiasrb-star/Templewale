name: Update YouTube Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch YouTube Videos
        env:
          API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ["API_KEY"]
          HANDLE = "@templewale"

          def get(url, params):
              query = urllib.parse.urlencode(params)
              with urllib.request.urlopen(url + "?" + query) as r:
                  return json.load(r)

          # Get channel
          channel = get(
              "https://www.googleapis.com/youtube/v3/channels",
              {
                  "part": "id,snippet,contentDetails",
                  "forHandle": HANDLE,
                  "key": API_KEY
              }
          )

          if not channel.get("items"):
              raise Exception("YouTube channel not found")

          item = channel["items"][0]

          channel_id = item["id"]
          channel_name = item["snippet"]["title"]
          uploads_playlist = item["contentDetails"]["relatedPlaylists"]["uploads"]

          # Get latest uploads
          playlist = get(
              "https://www.googleapis.com/youtube/v3/playlistItems",
              {
                  "part": "snippet,contentDetails",
                  "playlistId": uploads_playlist,
                  "maxResults": 20,
                  "key": API_KEY
              }
          )

          video_ids = [
              x["contentDetails"]["videoId"]
              for x in playlist.get("items", [])
          ]

          # Get video details including duration
          details = {}

          for i in range(0, len(video_ids), 50):
              batch = video_ids[i:i+50]

              data = get(
                  "https://www.googleapis.com/youtube/v3/videos",
                  {
                      "part": "contentDetails,snippet",
                      "id": ",".join(batch),
                      "key": API_KEY
                  }
              )

              for video in data.get("items", []):
                  details[video["id"]] = video

          videos = []
          shorts = []

          for item in playlist.get("items", []):

              snippet = item["snippet"]
              video_id = item["contentDetails"]["videoId"]

              detail = details.get(video_id, {})
              content = detail.get("contentDetails", {})

              duration = content.get("duration", "")

              video_data = {
                  "id": video_id,
                  "title": snippet["title"],
                  "description": snippet.get("description", ""),
                  "thumbnail": f"https://i.ytimg.com/vi/{video_id}/hqdefault.jpg",
                  "url": f"https://www.youtube.com/watch?v={video_id}",
                  "published": snippet["publishedAt"]
              }

              # Shorts: duration <= 3 minutes
              if duration.startswith("PT"):
                  import re

                  minutes = 0
                  seconds = 0

                  m = re.search(r"(\d+)M", duration)
                  s = re.search(r"(\d+)S", duration)

                  if m:
                      minutes = int(m.group(1))

                  if s:
                      seconds = int(s.group(1))

                  total_seconds = minutes * 60 + seconds

                  if total_seconds <= 180:
                      shorts.append(video_data)
                  else:
                      videos.append(video_data)
              else:
                  videos.append(video_data)

          output = {
              "channel": {
                  "id": channel_id,
                  "name": channel_name,
                  "handle": HANDLE
              },
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "videos": videos,
              "shorts": shorts
          }

          os.makedirs("data", exist_ok=True)

          with open("data/videos.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Updated {len(videos)} videos and {len(shorts)} shorts")
          PY

      - name: Commit YouTube Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/videos.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update YouTube content"
            git push
          fi
