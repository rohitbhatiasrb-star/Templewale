name: Update YouTube Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch YouTube Videos
        env:
          API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ["API_KEY"]
          HANDLE = "@templewale"

          def get(url, params):
              query = urllib.parse.urlencode(params)

              with urllib.request.urlopen(
                  url + "?" + query
              ) as r:
                  return json.load(r)

          # -----------------------------------------
          # GET CHANNEL
          # -----------------------------------------

          channel = get(
              "https://www.googleapis.com/youtube/v3/channels",
              {
                  "part": "id,snippet,contentDetails",
                  "forHandle": HANDLE,
                  "key": API_KEY
              }
          )

          if not channel.get("items"):
              raise Exception("YouTube channel not found")

          channel_item = channel["items"][0]

          channel_id = channel_item["id"]
          channel_name = channel_item["snippet"]["title"]

          uploads_playlist = (
              channel_item["contentDetails"]
              ["relatedPlaylists"]["uploads"]
          )

          # -----------------------------------------
          # GET LATEST UPLOADS
          # -----------------------------------------

          playlist = get(
              "https://www.googleapis.com/youtube/v3/playlistItems",
              {
                  "part": "snippet,contentDetails",
                  "playlistId": uploads_playlist,
                  "maxResults": 50,
                  "key": API_KEY
              }
          )

          video_ids = [
              x["contentDetails"]["videoId"]
              for x in playlist.get("items", [])
          ]

          # -----------------------------------------
          # GET VIDEO DETAILS INCLUDING DURATION
          # -----------------------------------------

          details = {}

          for i in range(0, len(video_ids), 50):

              batch = video_ids[i:i + 50]

              data = get(
                  "https://www.googleapis.com/youtube/v3/videos",
                  {
                      "part": "contentDetails,snippet",
                      "id": ",".join(batch),
                      "key": API_KEY
                  }
              )

              for video in data.get("items", []):
                  details[video["id"]] = video

          # -----------------------------------------
          # CONVERT YOUTUBE ISO DURATION TO SECONDS
          # -----------------------------------------

          def duration_to_seconds(duration):

              if not duration:
                  return 0

              match = re.match(
                  r"PT"
                  r"(?:(\d+)H)?"
                  r"(?:(\d+)M)?"
                  r"(?:(\d+)S)?",
                  duration
              )

              if not match:
                  return 0

              hours = int(match.group(1) or 0)
              minutes = int(match.group(2) or 0)
              seconds = int(match.group(3) or 0)

              return (
                  hours * 3600
                  + minutes * 60
                  + seconds
              )

          # -----------------------------------------
          # SEPARATE VIDEOS AND SHORTS
          # -----------------------------------------

          videos = []
          shorts = []

          for item in playlist.get("items", []):

              snippet = item["snippet"]

              video_id = item[
                  "contentDetails"
              ]["videoId"]

              detail = details.get(video_id, {})

              content = detail.get(
                  "contentDetails",
                  {}
              )

              duration_iso = content.get(
                  "duration",
                  ""
              )

              total_seconds = duration_to_seconds(
                  duration_iso
              )

              video_data = {
                  "id": video_id,
                  "title": snippet["title"],
                  "description": snippet.get(
                      "description",
                      ""
                  ),
                  "thumbnail":
                      f"https://i.ytimg.com/vi/"
                      f"{video_id}/hqdefault.jpg",
                  "url":
                      f"https://www.youtube.com/watch?v="
                      f"{video_id}",
                  "publishedAt":
                      snippet["publishedAt"],

                  # Duration information
                  "duration": duration_iso,
                  "durationSeconds": total_seconds
              }

              # -------------------------------------
              # SHORT CONDITION
              #
              # LESS THAN 90 SECONDS = SHORT
              #
              # 89 sec  -> SHORT
              # 90 sec  -> VIDEO
              # 91 sec  -> VIDEO
              # 180 sec -> VIDEO
              # -------------------------------------

              if total_seconds < 90:
                  shorts.append(video_data)

              else:
                  videos.append(video_data)

          # -----------------------------------------
          # OUTPUT
          # -----------------------------------------

          output = {
              "channel": {
                  "id": channel_id,
                  "name": channel_name,
                  "handle": HANDLE
              },

              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "videos": videos,

              "shorts": shorts
          }

          # -----------------------------------------
          # SAVE JSON
          # -----------------------------------------

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              "data/videos.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Updated "
              f"{len(videos)} videos and "
              f"{len(shorts)} shorts"
          )

          print(
              "Short rule: duration < 90 seconds"
          )

          PY

      - name: Commit YouTube Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/videos.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update YouTube content"
            git push
          fi
